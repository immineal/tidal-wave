# Flathub manifest for Tidal Wave. The id is the one spelling used everywhere:
# the metainfo component id, the .desktop basename and this file's own name.
id: io.github.immineal.TidalWave

# org.kde.Platform is the runtime Qt 6 apps use on Flathub.
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

# The binary keeps its own name. Only the reverse-DNS identifiers use the app id.
command: tidal-wave

finish-args:
  # Tidal's API and the audio streams. Also the cast media server, which listens
  # on a LAN address so the Chromecast can fetch the track from us
  # (src/cast/CastMediaServer.cpp).
  - --share=network
  # X11 needs shared IPC for MIT-SHM. It travels with the fallback socket below.
  - --share=ipc
  # The normal path on a current desktop.
  - --socket=wayland
  # Used only where there is no Wayland compositor to talk to.
  - --socket=fallback-x11
  # Audio out. PipeWire answers on the same socket, so this covers both.
  - --socket=pulseaudio
  # Qt Quick renders through the GPU. Without this every machine falls back to
  # llvmpipe.
  - --device=dri
  # MPRIS, so the media keys and the panel's player widget work.
  # src/mpris/MprisPlayer.cpp registers exactly this name.
  - --own-name=org.mpris.MediaPlayer2.tidalwave
  # The tray icon: a StatusNotifierItem that Qt names
  # org.kde.StatusNotifierItem-<pid>-<n>. The first process in the sandbox has
  # pid 2; a second tray icon would be -2-2 and need its own own-name.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  # Chromecast discovery: libavahi-client asks the host's avahi-daemon on the
  # system bus. Where this is refused the device list stays empty and nothing
  # else is affected.
  - --system-talk-name=org.freedesktop.Avahi
  # The download dialog starts in the music folder and remembers the last
  # directory. The file the user picks is granted through the portal.
  - --filesystem=xdg-music

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /lib/systemd
  - /share/man
  - /share/dbus-1/system-services
  - '*.la'
  - '*.a'

modules:
  # Only the client library, which is all src/cast/CastDiscovery.cpp links; the
  # daemon stays on the host. Built here because CMakeLists.txt requires
  # avahi-client.pc. If org.kde.Sdk carries it, this module can go.
  - name: avahi
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-libdaemon
      - --disable-autoipd
      - --disable-mono
      - --disable-monodoc
      - --disable-python
      - --disable-qt3
      - --disable-qt4
      - --disable-qt5
      - --disable-gtk
      - --disable-gtk3
      - --disable-libevent
      - --disable-dbm
      - --disable-introspection
      - --disable-core-docs
      - --disable-manpages
      - --disable-doxygen-doc
      - --with-distro=none
      - --with-systemdsystemunitdir=no
    cleanup:
      - /bin
      - /etc
      - /lib/avahi
      - /share/applications
      - /share/avahi
      - /share/dbus-1
      - /share/locale
    sources:
      - type: archive
        url: https://github.com/avahi/avahi/releases/download/v0.8/avahi-0.8.tar.gz
        sha256: 060309d7a333d38d951bc27598c677af1796934dbd98e1024e7ad8de798fedda

  - name: tidal-wave
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    # CMakeLists.txt strips the installed binary itself, so the .Debug
    # extension ships no symbols. -DCMAKE_STRIP= here would switch that off and
    # let flatpak-builder split the debug info.
    sources:
      - type: git
        url: https://github.com/immineal/tidal-wave.git
        tag: v0.4.0
        # Flathub wants the commit the tag resolved to, so the source cannot
        # move under a re-cut tag: git rev-parse v0.4.0^{commit}. It must be a
        # commit whose metainfo carries <screenshots>.
        commit: 6ce3b214e9b4e54ac527f0fd1e589e26a8baba19
    post-install:
      # Flatpak exports only files named after the app id, so the icons get a
      # second copy under the id and the desktop entry points at it. The
      # tidal-wave names stay: QIcon::fromTheme("tidal-wave") needs them.
      - install -Dm644 /app/share/icons/hicolor/128x128/apps/tidal-wave.png /app/share/icons/hicolor/128x128/apps/io.github.immineal.TidalWave.png
      - install -Dm644 /app/share/icons/hicolor/scalable/apps/tidal-wave.svg /app/share/icons/hicolor/scalable/apps/io.github.immineal.TidalWave.svg
      - desktop-file-edit --set-icon=io.github.immineal.TidalWave /app/share/applications/io.github.immineal.TidalWave.desktop
