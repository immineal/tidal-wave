name: CI

# Build on every push and pull request so cross-platform breakage (e.g. Linux-only
# /tmp paths, resource-prefix changes) is caught before a release, not after.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One Qt for all three platforms: 6.12.0 has aqt binaries everywhere
        # (win64_msvc2022_64 / clang_64 / linux_gcc_64), which the old per-OS
        # split existed to work around. Keep this in sync with release.yml.
        include:
          - os: ubuntu-latest
            qt: '6.12.0'
          - os: windows-latest
            qt: '6.12.0'
          - os: macos-latest
            qt: '6.12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          # qtmultimedia is the only add-on module needed; QtSvg/DBus/Sql/etc.
          # ship in the base desktop install (aqt has no separate 'qtsvg' module).
          # qttools supplies lrelease, without which CMake skips the .qm
          # catalogues and the binary ships English-only.
          modules: 'qtmultimedia qttools'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libasound2-dev libavahi-client-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

  # Tests are Linux-only on purpose: the suite is platform-independent, and one
  # runner keeps CI fast. QML tests need a QPA plugin, hence offscreen.
  test:
    name: Tests (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          # qtmultimedia and qttools as in the build job; Qt6::Test and
          # Qt6::QuickTest ship with the base desktop install.
          modules: 'qtmultimedia qttools'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libasound2-dev libavahi-client-dev

      - name: Configure
        run: cmake -B build-tests -S . -DCMAKE_BUILD_TYPE=Debug -DTIDALWAVE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-tests --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-tests --output-on-failure

  # The declared Qt floor, which no other job here builds: every job above pins
  # 6.12, so a construct that needs a newer Qt than find_package(Qt6 6.4) asks
  # for compiles green all the way to the .deb and then fails on the machine of
  # whoever installed it. Debian 12 "bookworm" is that floor exactly - Qt 6.4.2
  # and GCC 12.2 - and it is the distribution the release .deb targets.
  #
  # Tests run here, not only the build. What this is for is QML that a newer Qt
  # accepts and 6.4 does not, and that is a load-time error rather than a
  # compile-time one: assigning a property the type does not have ("Cannot
  # assign to non-existent property popupType") is raised when the engine loads
  # the file. tests/qml/*.qml are only ever loaded at runtime, so a build-only
  # job cannot see them at all - which is how the declarative popupType in
  # tst_menus_and_glyphs.qml that e972e24 replaced survived until a Debian box
  # ran the suite on real 6.4.2. Qt comes from apt, as in packaging/Dockerfile,
  # so nothing is downloaded and the version cannot drift.
  test-debian-12:
    name: Tests (Debian 12, Qt 6.4)
    runs-on: ubuntu-latest
    container: debian:bookworm

    steps:
      # Before the checkout: the container is bare, and actions/checkout needs
      # git or it silently falls back to a tarball download with no .git.
      # The package set is packaging/Dockerfile's, which documents why each
      # entry is there - in particular gstreamer1.0-plugins-good, without which
      # Qt 6.4's GStreamer media backend builds a null pipeline and segfaults
      # the moment a test touches QMediaPlayer.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libavahi-client-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            libasound2 gstreamer1.0-plugins-good

      - name: Checkout repository
        uses: actions/checkout@v4

      # No CMAKE_PREFIX_PATH: apt's Qt is on the default search path, and
      # pinning one is the dev-machine leak this job exists to catch.
      - name: Configure
        run: cmake -B build-deb12 -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTIDALWAVE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-deb12 --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The count first: a ctest that discovered nothing exits 0, which
          # would make this job a green light for an empty run.
          n=$(ctest --test-dir build-deb12 -N | sed -n 's/^Total Tests: //p')
          echo "ctest sees ${n:-0} tests"
          test "${n:-0}" -ge 1
          ctest --test-dir build-deb12 --output-on-failure

  # Ten seconds, no Qt, no build: catches a private address being committed
  # before anything slow runs. An allowlist and not a blocklist on purpose -
  # the address this exists to keep out never has to be written down here, and
  # the next one is caught too.
  addresses:
    name: Only addresses we mean to publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan the tracked tree
        run: |
          allowed='tidal-wave@linu\.li|noreply@anthropic\.com|someone@example\.com'
          # tidal-wave@linu.li is the project mailbox (src/ui/Feedback.cpp, the
          # .deb Maintainer field). someone@example.com is the fake username in
          # tests/tst_auth.cpp. Anything else is a mistake until it is added here.
          found=$(git grep -hoIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . \
                  | sort -u | grep -ivE "^($allowed)$" || true)
          if [ -n "$found" ]; then
            echo "Addresses in the tree that are not on the allowlist:"
            echo "$found"
            echo
            echo "Either take it out, or add it to \$allowed in this job."
            exit 1
          fi
          echo "clean"

  # Also seconds, no Qt, no build, for the same reason the job above exists: the
  # two files every Linux store reads are the two nothing else in CI looks at,
  # and a mistake in either is found by the store that rejects the submission.
  # The AppStream metainfo file is the hard blocker for Flathub, KDE Discover and
  # GNOME Software - see docs/PACKAGING.md.
  store-metadata:
    name: The metadata stores read is valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the validators
        run: |
          sudo apt-get update
          # ca-certificates is not decoration: appstreamcli reaches out to every
          # <url> in the file (and will reach out to every screenshot once there
          # are any), and without a CA bundle each one comes back as
          # "W: url-not-reachable ... server certificate verification failed",
          # which is four warnings and a red job on a correct file.
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils ca-certificates

      - name: Validate both files, and check they still agree with the project
        run: |
          set -euo pipefail
          id=io.github.immineal.TidalWave
          # Named after the app id, not after the binary: Flatpak exports only
          # <app-id>.desktop. The check below that <launchable> matches this
          # basename is what keeps the two from drifting apart again.
          desktop="packaging/$id.desktop"
          template="packaging/$id.metainfo.xml.in"

          # --warn-kde because Plasma is where this app's tray lives and where a
          # blank icon has already cost a bug once; the extra checks are free.
          desktop-file-validate --warn-kde "$desktop"
          echo "desktop-file-validate: clean"

          # The metainfo file in the tree is a configure_file() template, so
          # substitute it the way CMakeLists.txt does - out of the same single
          # declaration of the version - and validate the text that is actually
          # installed rather than the template.
          ver=$(sed -n 's/^project(tidal-wave VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$ver" || { echo "no version found in CMakeLists.txt"; exit 1; }
          echo "project() version: $ver"
          sed "s/@PROJECT_VERSION@/$ver/g" "$template" > "$id.metainfo.xml"
          if grep -q '@[A-Z_]*@' "$id.metainfo.xml"; then
            echo "a @PLACEHOLDER@ survived substitution:"
            grep -n '@[A-Z_]*@' "$id.metainfo.xml"
            exit 1
          fi

          # No --no-net on purpose. Once a <screenshots> block exists, this is
          # the step that fetches each image and fails on one that is not there,
          # which is otherwise a mistake Flathub finds for us.
          #
          # --explain and --pedantic are for the log, not for the verdict.
          # appstreamcli exits non-zero on errors and on warnings, and zero on
          # infos and pedantic hints, so the gate is its own severity judgement
          # with nothing escalated on top. Escalating pedantic would be wrong
          # here: the one hint this file draws is cid-contains-uppercase-letter
          # on io.github.immineal.TidalWave, and that is the app id the owner
          # decided on and the casing Flathub itself uses throughout. A job that
          # goes red on a correct file teaches people to ignore it.
          appstreamcli validate --explain --pedantic "$id.metainfo.xml"

          # The three ways the component names itself, which nothing above can
          # check because each lives in a different file:
          #
          # 1. AppStream pairs a metainfo file with its component by filename, so
          #    <id> and the installed basename have to be the same string. This
          #    is also the guard against the second spelling of the app id that
          #    docs/PACKAGING.md warns about.
          grep -q "<id>$id</id>" "$id.metainfo.xml" \
            || { echo "<id> does not match the filename $id.metainfo.xml"; exit 1; }
          # 2. <launchable> has to name the desktop entry as installed. If it
          #    does not, the store lists an app with no way to start it.
          want=$(sed -n 's@.*<launchable type="desktop-id">\(.*\)</launchable>.*@\1@p' \
                 "$id.metainfo.xml")
          test "$want" = "$(basename "$desktop")" \
            || { echo "<launchable> says '$want', we install '$(basename "$desktop")'"; exit 1; }
          # 3. The version must not be a second copy of project()'s. The template
          #    has to defer to CMake for it, and the PKGBUILD cannot (pkgver is
          #    needed before any source is fetched), so it is checked instead.
          grep -q 'version="@PROJECT_VERSION@"' "$template" \
            || { echo "$template hardcodes a version instead of taking @PROJECT_VERSION@"; exit 1; }
          pkgver=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          test "$pkgver" = "$ver" \
            || { echo "packaging/PKGBUILD says pkgver=$pkgver, project() says $ver"; exit 1; }

          echo "id, launchable and version all agree"
