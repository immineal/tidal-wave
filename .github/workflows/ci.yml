name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is held at 6.10.3: aqtinstall 3.3.0 cannot read the repository
        # layout Qt uses for Windows from 6.11.0 on. Keep in sync with release.yml.
        # ubuntu-24.04 by name, because ubuntu-latest moves under a release.
        include:
          - os: ubuntu-24.04
            qt: '6.12.0'
          - os: windows-latest
            qt: '6.10.3'
          - os: macos-latest
            qt: '6.12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          # qtmultimedia is the only add-on needed. qttools is not a module for
          # 6.12 and asking for it fails the step; lrelease ships in the base
          # install.
          modules: 'qtmultimedia'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavahi-client-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DTIDALWAVE_REQUIRE_TRANSLATIONS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

  # Tests are Linux-only on purpose: the suite is platform-independent, and one
  # runner keeps CI fast. QML tests need a QPA plugin, hence offscreen.
  test:
    name: Tests (Ubuntu 24.04, Qt 6.12)
    runs-on: ubuntu-24.04
    # A ceiling for a hung run; the default is six hours.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          # As in the build job. Qt6::Test and Qt6::QuickTest ship in the base
          # install.
          modules: 'qtmultimedia'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavahi-client-dev

      - name: Configure
        run: cmake -B build-tests -S . -DCMAKE_BUILD_TYPE=Debug -DTIDALWAVE_BUILD_TESTS=ON -DTIDALWAVE_REQUIRE_TRANSLATIONS=ON

      - name: Build
        run: cmake --build build-tests --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-tests --output-on-failure

      - name: List skipped test cases
        if: always()
        run: |
          tests/list-skipped.sh build-tests | tee skipped.txt
          # The session bus test guards the media keys. It must not be among them.
          ! grep -q TestSessionBus skipped.txt

  # The declared Qt floor: Debian 12 has Qt 6.4.2 and GCC 12.2. Tests run too,
  # because QML that 6.4 rejects fails at load time, which a build cannot see.
  # Qt comes from apt, as in packaging/Dockerfile, so the version cannot drift.
  test-debian-12:
    name: Tests (Debian 12, Qt 6.4)
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 60

    steps:
      # Before the checkout: actions/checkout needs git, or it falls back to a
      # tarball with no .git. The package set is packaging/Dockerfile's.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libavahi-client-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            libasound2 pulseaudio dbus-daemon ffmpeg

      - name: Checkout repository
        uses: actions/checkout@v7

      # No CMAKE_PREFIX_PATH: apt's Qt is on the default search path, and
      # pinning one is the dev-machine leak this job exists to catch.
      - name: Configure
        run: cmake -B build-deb12 -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTIDALWAVE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-deb12 --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The count first: a ctest that discovered nothing exits 0, which
          # would make this job a green light for an empty run.
          n=$(ctest --test-dir build-deb12 -N | sed -n 's/^Total Tests: //p')
          echo "ctest sees ${n:-0} tests"
          test "${n:-0}" -ge 1
          tests/with-null-sink.sh ctest --test-dir build-deb12 --output-on-failure

      - name: List skipped test cases
        if: always()
        run: |
          tests/list-skipped.sh build-deb12 | tee skipped.txt
          # The session bus test guards the media keys. It must not be among them.
          ! grep -q TestSessionBus skipped.txt

  # The distributions' own Qt, one job per minor version they carry, each with
  # that distribution's FFmpeg, fonts and packaging of the media backends.
  # Fedora and Arch move their Qt, so a job prints the version it found.
  test-distribution:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12's Qt with a newer FFmpeg: where the .deb is installed most.
          - name: Ubuntu 24.04, its own Qt 6.4
            image: ubuntu:24.04
            git: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          - name: Debian 13, Qt 6.8
            image: debian:trixie
            git: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          - name: Ubuntu 26.04, Qt 6.10
            image: ubuntu:26.04
            git: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          # Its default font is a variable one, which lays text out differently.
          - name: Fedora 44, Qt 6.11
            image: fedora:44
            git: dnf install -y git-core
          # Rolling: where a new Qt or FFmpeg meets the PKGBUILD first.
          - name: Arch Linux, Qt 6.12
            image: archlinux:base-devel
            git: pacman -Syu --noconfirm git

    steps:
      # Before the checkout, for the reason given in the Debian 12 job.
      - name: Install git
        run: ${{ matrix.git }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build and test dependencies
        run: packaging/ci/install-test-deps.sh

      - name: Show the Qt version
        run: qmake6 -query QT_VERSION

      - name: Configure
        run: cmake -B build-distro -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTIDALWAVE_BUILD_TESTS=ON -DTIDALWAVE_REQUIRE_TRANSLATIONS=ON

      - name: Build
        run: cmake --build build-distro --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The count first, as in the Debian 12 job.
          n=$(ctest --test-dir build-distro -N | sed -n 's/^Total Tests: //p')
          echo "ctest sees ${n:-0} tests"
          test "${n:-0}" -ge 1
          tests/with-null-sink.sh ctest --test-dir build-distro --output-on-failure

      - name: List skipped test cases
        if: always()
        run: |
          tests/list-skipped.sh build-distro | tee skipped.txt
          # The session bus test guards the media keys. It must not be among them.
          ! grep -q TestSessionBus skipped.txt

  # Qt from the Qt installer on both sides of the version switches in the code
  # (6.5, 6.7, 6.8), and the newest minor below the one the release ships.
  # Each bundles its own FFmpeg. Steps as in the Qt 6.12 job.
  test-installer-qt:
    name: Tests (Ubuntu 24.04, Qt ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        qt: ['6.5.3', '6.7.3', '6.8.3', '6.11.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: 'qtmultimedia'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavahi-client-dev

      - name: Configure
        run: cmake -B build-tests -S . -DCMAKE_BUILD_TYPE=Debug -DTIDALWAVE_BUILD_TESTS=ON -DTIDALWAVE_REQUIRE_TRANSLATIONS=ON

      - name: Build
        run: cmake --build build-tests --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          n=$(ctest --test-dir build-tests -N | sed -n 's/^Total Tests: //p')
          echo "ctest sees ${n:-0} tests"
          test "${n:-0}" -ge 1
          ctest --test-dir build-tests --output-on-failure

      - name: List skipped test cases
        if: always()
        run: |
          tests/list-skipped.sh build-tests | tee skipped.txt
          # The session bus test guards the media keys. It must not be among them.
          ! grep -q TestSessionBus skipped.txt

  # Catches a private address before anything slow runs. An allowlist, so the
  # address it keeps out never has to be written down here.
  addresses:
    name: Only addresses we mean to publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history, because the second scan reads who each commit
          # says it is by.
          fetch-depth: 0

      - name: Scan the tracked tree
        run: |
          allowed='tidal-wave@linu\.li|noreply@anthropic\.com|someone@example\.com'
          # Allowed: the project mailbox and the fake user in tests/tst_auth.cpp.
          # @BASE@ is the marker in the DASH fixtures; what follows it reads as a
          # domain, so it comes out first. This file is scanned too.
          found=$(git grep -hI -e '' -- . | sed 's/@BASE@//g' \
                  | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
                  | sort -u | grep -ivE "^($allowed)$" || true)
          if [ -n "$found" ]; then
            echo "Addresses in the tree that are not on the allowlist:"
            echo "$found"
            echo
            echo "Either take it out, or add it to \$allowed in this job."
            exit 1
          fi
          echo "clean"

      - name: Scan the maintainer's own commits
        run: |
          # Commit metadata is not in the tree. The maintainer's commits must
          # carry a GitHub noreply address; other authors sign as they like.
          found=$(git log --format='%an <%ae>%n%cn <%ce>' \
                  | grep '^Linus Linhof <' | sort -u \
                  | grep -vE '<[0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com>$' || true)
          if [ -n "$found" ]; then
            echo "Commits by the maintainer signed with something other than a noreply address:"
            echo "$found" | sed 's/<.*>/<address withheld from this log>/'
            echo
            echo "Set user.email for this repository and rewrite those commits before they are pushed."
            exit 1
          fi
          echo "clean"

  # The desktop entry and the AppStream metainfo are read by every Linux store
  # and by nothing else in CI.
  store-metadata:
    name: The metadata stores read is valid
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the validators
        run: |
          sudo apt-get update
          # ca-certificates: appstreamcli fetches every <url> in the file, and
          # without a CA bundle each one fails as url-not-reachable.
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils ca-certificates

      - name: Validate both files, and check they still agree with the project
        run: |
          set -euo pipefail
          id=io.github.immineal.TidalWave
          # Named after the app id: Flatpak exports only <app-id>.desktop.
          desktop="packaging/$id.desktop"
          template="packaging/$id.metainfo.xml.in"

          # --warn-kde: Plasma is where this app's tray lives.
          desktop-file-validate --warn-kde "$desktop"
          echo "desktop-file-validate: clean"

          # The file in the tree is a configure_file() template: substitute the
          # version as CMakeLists.txt does and validate what is installed.
          ver=$(sed -n 's/^project(tidal-wave VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$ver" || { echo "no version found in CMakeLists.txt"; exit 1; }
          echo "project() version: $ver"
          sed "s/@PROJECT_VERSION@/$ver/g" "$template" > "$id.metainfo.xml"
          if grep -q '@[A-Z_]*@' "$id.metainfo.xml"; then
            echo "a @PLACEHOLDER@ survived substitution:"
            grep -n '@[A-Z_]*@' "$id.metainfo.xml"
            exit 1
          fi

          # No --no-net: this step fetches each screenshot and fails on a missing
          # one. --pedantic only adds hints to the log; appstreamcli exits
          # non-zero on errors and warnings alone.
          appstreamcli validate --explain --pedantic "$id.metainfo.xml"

          # 1. AppStream pairs a metainfo file with its component by filename, so
          #    <id> and the installed basename have to be the same string.
          grep -q "<id>$id</id>" "$id.metainfo.xml" \
            || { echo "<id> does not match the filename $id.metainfo.xml"; exit 1; }
          # 2. <launchable> has to name the desktop entry as installed. If it
          #    does not, the store lists an app with no way to start it.
          want=$(sed -n 's@.*<launchable type="desktop-id">\(.*\)</launchable>.*@\1@p' \
                 "$id.metainfo.xml")
          test "$want" = "$(basename "$desktop")" \
            || { echo "<launchable> says '$want', we install '$(basename "$desktop")'"; exit 1; }
          # 3. The version must not be a second copy of project()'s. The template
          #    has to defer to CMake for it, and the PKGBUILD cannot (pkgver is
          #    needed before any source is fetched), so it is checked instead.
          grep -q 'version="@PROJECT_VERSION@"' "$template" \
            || { echo "$template hardcodes a version instead of taking @PROJECT_VERSION@"; exit 1; }
          pkgver=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          test "$pkgver" = "$ver" \
            || { echo "packaging/PKGBUILD says pkgver=$pkgver, project() says $ver"; exit 1; }

          echo "id, launchable and version all agree"
