name: Build and Release

on:
  release:
    types: [published]
  # A rehearsal: the same builds and checks, with nothing uploaded to a release.
  workflow_dispatch:

# Read-only by default. Only the publish job may write to a release.
permissions:
  contents: read

jobs:
  # One archive per platform, each built against the Qt installer's Qt.
  desktop:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is held at 6.10.3 because aqtinstall cannot install a newer
        # one. Keep in sync with ci.yml.
        include:
          - os: ubuntu-24.04
            asset_name: tidal-wave-linux-x86_64.tar.gz
            qt: '6.12.0'
          - os: windows-latest
            asset_name: tidal-wave-windows-x64.zip
            qt: '6.10.3'
          - os: macos-latest
            asset_name: tidal-wave-macos-arm64.tar.gz
            qt: '6.12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          # The only add-on module needed. lrelease ships in the base install,
          # and TIDALWAVE_REQUIRE_TRANSLATIONS below fails the build without it.
          modules: 'qtmultimedia'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavahi-client-dev

      - name: Configure and build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DTIDALWAVE_REQUIRE_TRANSLATIONS=ON
          cmake --build build --config Release --parallel 4

      # The binary alone: it runs where Qt 6.12 is installed. The .deb and the
      # AppImage below are the packages that bring or declare their runtime.
      - name: Package binary (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: tar -czf ${{ matrix.asset_name }} -C build tidal-wave TidalWave

      - name: Package binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          macdeployqt build/tidal-wave.app -qmldir=qml
          cp -r build/TidalWave build/tidal-wave.app/Contents/MacOS/
          tar -czf ${{ matrix.asset_name }} -C build tidal-wave.app

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          windeployqt --qmldir qml build\Release\tidal-wave.exe
          Copy-Item -Path build\TidalWave -Destination build\Release\TidalWave -Recurse

          # The C++ runtime that the binary and Qt link. A fresh Windows has
          # none, and the program then exits before it draws anything.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $found = & $vswhere -latest -products * -find 'VC\Redist\MSVC\**\x64\Microsoft.VC*.CRT\vcruntime140.dll'
          $newest = $found | Where-Object { ($_ -split '\\')[-4] -match '^\d+(\.\d+)+$' } |
                    Sort-Object { [version]($_ -split '\\')[-4] } | Select-Object -Last 1
          if (-not $newest) { throw 'No Visual C++ runtime was found on this runner.' }
          Copy-Item -Path (Join-Path (Split-Path $newest) '*.dll') -Destination build\Release
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "build\Release\$dll")) { throw "$dll is missing from the archive." }
          }

          # Import libraries and the static QML library are linker by-products.
          Get-ChildItem build\Release -Recurse -Include *.lib, *.exp, *.pdb, *.ilk | Remove-Item
          Compress-Archive -Path build\Release\* -DestinationPath ${{ matrix.asset_name }}

      # Handed to the publish job, which is the only one that uploads.
      - name: Keep the archive for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error
          compression-level: 0

  # Built in a Debian 12 container: the dependency floors come from the Qt and
  # the compiler of the build, and a package built on this runner asks for
  # Qt 6.12, which no Debian or Ubuntu release can install.
  deb:
    name: tidal-wave-linux-x86_64.deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Fails when the floors read higher than libqt6core6 6.4, libstdc++6 12.
      - name: Build the package
        run: packaging/build-deb.sh

      # A bare image each time, so apt has to resolve the Depends list itself.
      - name: Install and start it on every supported distribution
        run: |
          for image in debian:bookworm debian:trixie ubuntu:24.04; do
            packaging/verify-deb.sh "$image"
          done

      # The name the README and earlier releases use.
      - name: Give the package its release name
        run: mv dist/tidal-wave_*_amd64.deb tidal-wave-linux-x86_64.deb

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: tidal-wave-linux-x86_64.deb
          path: tidal-wave-linux-x86_64.deb
          if-no-files-found: error
          compression-level: 0

  # CI checks these files offline, as the screenshots point at the tag. Here
  # the tag exists, so every URL is fetched, and publish waits for this job:
  # a broken screenshot stops the release. A rehearsal before the tag exists
  # checks offline and says so.
  store-metadata:
    name: The metadata stores read is valid, URLs included
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ca-certificates: without a CA bundle each URL fails as not reachable.
      - name: Install the validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils ca-certificates

      # On a release, the tag being released must be project()'s and every
      # screenshot must name it.
      - name: Validate both files and fetch every URL in the metainfo
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ver=$(sed -n 's/^project(tidal-wave VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$EVENT" = release ]; then
            if [ "$RELEASE_TAG" != "v$ver" ]; then
              echo "::error::The release is $RELEASE_TAG, but project() says $ver."
              exit 1
            fi
            packaging/validate-store-metadata.sh --tag "$RELEASE_TAG"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$ver" > /dev/null; then
            packaging/validate-store-metadata.sh --tag "v$ver"
          else
            echo "::notice title=Rehearsal::v$ver is not tagged yet, so the URLs are not fetched. The release run fetches them."
            packaging/validate-store-metadata.sh --no-net --tag "v$ver"
          fi

  # The README and the metainfo show assets/screenshot_*.png at the tag, so
  # they must be this release's UI. Drawn as screenshots.yml draws them, and
  # publish waits for this job.
  store-screenshots:
    name: The published screenshots show this release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtmultimedia'

      # As screenshots.yml, plus Pillow for the comparison. It goes into the
      # system Python: python3 on PATH is the one install-qt-action set up.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavahi-client-dev \
            xvfb libgl1-mesa-dri \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 \
            fonts-inter fonts-dejavu-core python3-pil

      - name: Draw the store set
        run: tests/visual/run.sh store

      # If a second draw does not match the first, the scene itself varies
      # and the comparison with assets/ would mean nothing.
      - name: Draw the Sea set again and compare the two
        run: |
          mkdir -p shots/first
          cp tests/visual/out/store_*_sea.png shots/first/
          STORE_THEMES=sea tests/visual/run.sh store
          /usr/bin/python3 -I tests/visual/compare-store.py --label "Two draws of the same scene" \
            'shots/first/store_{}_sea.png' 'tests/visual/out/store_{}_sea.png'

      - name: Compare with the committed screenshots
        run: |
          mkdir -p shots/fresh
          cp tests/visual/out/store_*.png shots/fresh/
          if ! /usr/bin/python3 -I tests/visual/compare-store.py --diffs shots/diff \
               'assets/screenshot_{}.png' 'shots/fresh/store_{}_sea.png'; then
            echo "::error title=Stale screenshots::Download this run's store-screenshots artifact, copy store_<scene>_sea.png over assets/screenshot_<scene>.png, commit, and move the tag."
            exit 1
          fi

      - name: Keep the fresh pictures and the diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots
          path: shots/
          if-no-files-found: ignore

  # Qt 6.12 and FFmpeg bundled, built on Ubuntu 22.04 for its older glibc.
  appimage:
    name: tidal-wave-x86_64.AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the AppImage
        run: packaging/build-appimage.sh

      # Fedora by number: a tag that moves would change this check under a
      # release. AlmaLinux 9 has glibc 2.34, the oldest the AppImage runs on.
      - name: Start it on every supported distribution
        run: |
          for image in debian:bookworm debian:trixie ubuntu:24.04 ubuntu:22.04 fedora:44 almalinux:9; do
            packaging/verify-appimage.sh "$image"
          done

      # One name across releases, so a link to the latest download keeps working
      # and the update information inside the AppImage keeps naming the zsync
      # file. That file names the AppImage in turn, and holds its checksum.
      - name: Give the AppImage and its zsync file their release names
        run: |
          mv dist/tidal-wave-*-x86_64.AppImage tidal-wave-x86_64.AppImage
          mv dist/tidal-wave-*-x86_64.AppImage.zsync tidal-wave-x86_64.AppImage.zsync

      - name: Keep both for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: tidal-wave-x86_64.AppImage
          path: |
            tidal-wave-x86_64.AppImage
            tidal-wave-x86_64.AppImage.zsync
          if-no-files-found: error
          compression-level: 0

  # Runs after a failed build too, so that the missing files are named once
  # here. Nothing is uploaded unless all six are present and the store
  # metadata and screenshots passed.
  publish:
    name: Checksums and upload
    needs: [desktop, deb, appimage, store-metadata, store-screenshots]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # !cancelled() lets this job run after a failure; a failed metadata
      # check leaves no file missing, so it is stopped here.
      - name: Stop if the store metadata failed
        if: needs.store-metadata.result != 'success'
        env:
          RESULT: ${{ needs.store-metadata.result }}
        run: |
          echo "::error::The store metadata check did not pass ($RESULT). Nothing is uploaded."
          exit 1

      - name: Stop if the screenshots are stale
        if: needs.store-screenshots.result != 'success'
        env:
          RESULT: ${{ needs.store-screenshots.result }}
        run: |
          echo "::error::The screenshot check did not pass ($RESULT). Nothing is uploaded."
          exit 1

      # Allowed to fail: with no artifacts at all, the next step says so.
      - name: Collect what the build jobs kept
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: tidal-wave-*
          path: release
          merge-multiple: true

      - name: Check that all six files are there
        run: |
          mkdir -p release
          cd release
          missing=0
          for file in \
            'tidal-wave-linux-x86_64.deb' \
            'tidal-wave-x86_64.AppImage' \
            'tidal-wave-x86_64.AppImage.zsync' \
            'tidal-wave-linux-x86_64.tar.gz' \
            'tidal-wave-macos-arm64.tar.gz' \
            'tidal-wave-windows-x64.zip'
          do
            if ! compgen -G "$file" > /dev/null; then
              echo "::error::Missing from the release: $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "A build job above failed. Nothing is uploaded."
            exit 1
          fi

      # Relative names, so `sha256sum -c SHA256SUMS` works next to a download.
      - name: Write SHA256SUMS
        run: |
          cd release
          sha256sum tidal-wave-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

      # The rehearsal's result: the set a release would have received.
      - name: Keep the set as one artifact (rehearsal)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-rehearsal
          path: release/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
