name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Per-OS Qt (see ci.yml): Windows on 6.7.3 (aqt lacks 6.11 there),
        # macOS/Linux on 6.11.1 (6.7.x links a removed 'AGL' framework on macOS).
        include:
          - os: ubuntu-latest
            asset_name: tidal-wave-linux-x86_64.tar.gz
            qt: '6.11.1'
          - os: windows-latest
            asset_name: tidal-wave-windows-x64.zip
            qt: '6.7.3'
          - os: macos-latest
            asset_name: tidal-wave-macos-x64.tar.gz
            qt: '6.11.1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          # qtmultimedia is the only add-on module needed; QtSvg/DBus/Sql/etc.
          # ship in the base desktop install (aqt has no separate 'qtsvg' module).
          modules: 'qtmultimedia'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libasound2-dev libavahi-client-dev

      - name: Configure and build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4

      - name: Package binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czf ${{ matrix.asset_name }} -C build tidal-wave TidalWave
          # Also build a .deb with the correct runtime dependencies declared.
          (cd build && cpack -G DEB)
          mv build/tidal-wave-*-Linux.deb ./tidal-wave-linux-x86_64.deb

      - name: Package binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          macdeployqt build/tidal-wave.app -qmldir=qml
          cp -r build/TidalWave build/tidal-wave.app/Contents/MacOS/
          tar -czf ${{ matrix.asset_name }} -C build tidal-wave.app

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          windeployqt --qmldir qml build\Release\tidal-wave.exe
          Copy-Item -Path build\TidalWave -Destination build\Release\TidalWave -Recurse
          Compress-Archive -Path build\Release\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          # The .deb glob only matches on Linux; unmatched globs are ignored.
          files: |
            ${{ matrix.asset_name }}
            *.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
